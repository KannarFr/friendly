name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils
          python3 -m pip install --quiet pyflakes

      - name: ShellCheck (bash entrypoint)
        run: shellcheck -S warning friendly

      - name: Python checks (overlay)
        run: |
          python3 -m pyflakes friendly-input.py
          python3 -m py_compile friendly-input.py

      - name: Validate desktop entry
        run: desktop-file-validate friendly.desktop

  gh-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release edit "$GITHUB_REF_NAME" --generate-notes

  aur:
    name: publish to AUR
    if: startsWith(github.ref, 'refs/tags/')
    needs: gh-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Mirror the release into the AUR `friendly` package. The deploy action runs
      # in an Arch container, runs updpkgsums against the GitHub source tarball,
      # regenerates .SRCINFO, and pushes using a DEDICATED key in
      # secrets.AUR_SSH_PRIVATE_KEY (the GITHUB_TOKEN above has no AUR access).
      # See packaging/README.md.
      - name: Pin AUR pkgver to this tag
        run: sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" packaging/aur/PKGBUILD

      - name: Publish friendly to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: friendly
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: KannarFr
          commit_email: kannarfr@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          updpkgsums: true

      # Mirror the released pkgver/sha256 back into the in-repo aur files so the
      # committed copy reflects the latest release. [skip ci] avoids a re-trigger.
      - name: Sync AUR PKGBUILD/.SRCINFO to main
        run: |
          ver="${GITHUB_REF_NAME#v}"
          curl -sSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o src.tar.gz
          sum=$(sha256sum src.tar.gz | awk '{print $1}')
          git fetch --depth=1 origin main
          git checkout -f -B main FETCH_HEAD
          sed -i -E \
            -e "s/^pkgver=.*/pkgver=${ver}/" \
            -e "s/^sha256sums=.*/sha256sums=('${sum}')/" \
            packaging/aur/PKGBUILD
          sed -i -E \
            -e "s/^([[:space:]]*pkgver) = .*/\1 = ${ver}/" \
            -e "s/^([[:space:]]*sha256sums) = .*/\1 = ${sum}/" \
            packaging/aur/.SRCINFO
          if git diff --quiet -- packaging/aur/; then
            echo "aur already in sync; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          git commit -m "chore: sync friendly to ${GITHUB_REF_NAME} [skip ci]"
          git push origin main

  deb:
    name: build .deb (Debian/Ubuntu)
    if: startsWith(github.ref, 'refs/tags/')
    needs: gh-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper devscripts dpkg-dev

      - name: Build the package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # debian/ must sit at the source root for dpkg-buildpackage.
          cp -r packaging/debian debian
          # pin the changelog version to this tag (native package, no -rev).
          sed -i "1s/^friendly (.*)/friendly (${ver})/" debian/changelog
          dpkg-buildpackage -b -us -uc
          mv ../friendly_${ver}_all.deb .
          echo "DEB=friendly_${ver}_all.deb" >> "$GITHUB_ENV"

      - name: Attach .deb to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$DEB" --clobber

      - name: Upload .deb as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: friendly-deb
          path: ${{ env.DEB }}
          if-no-files-found: error
